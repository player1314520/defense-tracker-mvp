<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>防务追踪 V9 · 移动门户</title>
  <link rel="stylesheet" href="/portal/style.css">
</head>
<body>
<main>
  <header>
    <div class="eyebrow">ZERO-KNOWLEDGE MOBILE PORTAL</div>
    <h1>防务追踪 V9</h1>
    <p>总览、告警、审批和任务状态。Supabase 只传递密文，正文只在已配对浏览器内解密。</p>
  </header>
  <section id="anonymous-access" class="access-grid">
    <form id="application-form" autocomplete="off">
      <h2>申请受控公测</h2>
      <label>联系邮箱<input id="application-email" type="email" autocomplete="off" spellcheck="false" maxlength="254" required></label>
      <label class="consent"><input id="application-consent" type="checkbox" required>我同意公测使用规则与隐私说明</label>
      <button id="application-submit" type="submit" disabled>提交申请</button>
    </form>
    <form id="login-form" autocomplete="off">
      <h2>获批用户登录</h2>
      <label>受邀邮箱<input id="email" type="email" autocomplete="email" maxlength="254" required></label>
      <button id="login-submit" type="submit" disabled>发送邮箱登录链接</button>
    </form>
  </section>
  <p id="status" role="status" aria-live="polite">正在连接 Supabase Staging…</p>
  <section id="authenticated-dashboard" hidden>
    <section id="workspace" class="portal-workspace">
      <label>当前组织<select id="organization"></select></label>
      <div class="role-chip">当前角色 <strong id="current-role">—</strong></div>
      <button id="unlock" type="button">登记设备 / 本地解锁</button>
      <button id="logout" class="secondary" type="button">安全退出</button>
    </section>
    <section class="metrics" aria-label="态势计数">
      <article><span>同步记录</span><strong id="metric-records">0</strong></article>
      <article><span>待处理告警</span><strong id="metric-alerts">0</strong></article>
      <article><span>待审稿件</span><strong id="metric-approvals">0</strong></article>
    </section>
    <section class="board-grid" aria-label="共享工作区只读总览">
      <section><h2>共享告警</h2><div id="alert-list" class="record-list"></div></section>
      <section><h2>任务与推演</h2><div id="job-list" class="record-list"></div></section>
      <section><h2>签发工作流</h2><div id="publication-list" class="record-list"></div></section>
    </section>
    <section id="admin-panel" class="admin-panel" hidden>
      <div class="section-heading">
        <div><span class="eyebrow">CONTROL PLANE</span><h2>准入与设备审批</h2></div>
        <button id="refresh-admin" class="secondary" type="button">刷新队列</button>
      </div>
      <div class="admin-grid">
        <section><h3>公测申请</h3><div id="application-list" class="record-list"></div></section>
        <section><h3>待批准设备</h3><div id="device-list" class="record-list"></div></section>
      </div>
    </section>
  </section>
</main>
<script type="module" src="/portal/app.js"></script>
</body>
</html>
