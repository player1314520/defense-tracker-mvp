# nginx.conf — 防务追踪系统反向代理
# 将 your-domain.com 替换为你的实际域名

# ── 限速 zone 定义（limit_req_zone 是 http 级指令，必须在 server 块之外）──
# 本文件被 include 进 nginx 主配置的 http{} 上下文，故此处即 http 级。
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/m;

# ── HTTP → HTTPS 重定向 ─────────────────────────────────────
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt ACME 验证（certbot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务 ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ── SSL 证书（使用 certbot/Let's Encrypt 生成）──────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # ── 安全响应头 ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 覆盖客户端自带 X-Forwarded-For；Flask 仅在本 Nginx 对端地址被显式列入
    # DEFENSE_TRACKER_TRUSTED_PROXIES 后才会消费该单值。

    # ── 登录页限速 ──────────────────────────────────────────
    location = /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass         http://tracker:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API 限速 ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://tracker:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI生成/批量要讯最长等待5分钟（需 ≥ gunicorn --timeout）
    }

    # ── 静态文件缓存 ────────────────────────────────────────
    location /static/ {
        proxy_pass        http://tracker:5000;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $remote_addr;
        proxy_set_header  X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1d;
        add_header       Cache-Control "public, max-age=86400";
    }

    # ── 其余请求 ────────────────────────────────────────────
    location / {
        proxy_pass         http://tracker:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 上传大小限制 ────────────────────────────────────────
    client_max_body_size 20M;
}
