name: V9 signed candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected main commit
        required: true
        type: string
      application_run_id:
        description: Successful V9 application-signing run ID
        required: true
        type: string
      application_run_attempt:
        description: Exact V9 application-signing run attempt
        required: true
        type: string
      installer_envelope_artifact:
        description: Exact encrypted unsigned-installer artifact name
        required: true
        type: string
      installer_envelope_digest:
        description: Exact encrypted unsigned-installer artifact digest
        required: true
        type: string
      installer_request_artifact:
        description: Exact public installer-request artifact name
        required: true
        type: string
      installer_request_digest:
        description: Exact public installer-request artifact digest
        required: true
        type: string
      installer_signing_request_sha256:
        description: Exact SHA-256 of installer-signing-request.json
        required: true
        type: string
      application_handoff:
        description: Exact JSON binding the signed application artifact, receipt, digests, and request/receipt SHA-256 values
        required: true
        type: string

permissions: {}

concurrency:
  group: v9-signed-candidate
  cancel-in-progress: false

env:
  AGE_VERSION: "1.3.2"
  AGE_ARCHIVE_SHA256: "f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7"
  SDK_PACKAGE_VERSION: "10.0.26100.4188"
  SDK_PACKAGE_SHA256: "180deb372659029864c10a0c04787833234d64aacd1d2c0661d2c00295d8e022"
  AZURE_CLIENT_VERSION: "1.0.128"
  AZURE_CLIENT_SHA256: "74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b"

jobs:
  verify-installer-request:
    name: Resolve exact installer request and prior-run artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      application_signed_artifact: ${{ steps.verify.outputs.application_signed_artifact }}
      application_signed_digest: ${{ steps.verify.outputs.application_signed_digest }}
      application_receipt_artifact: ${{ steps.verify.outputs.application_receipt_artifact }}
      application_receipt_digest: ${{ steps.verify.outputs.application_receipt_digest }}
      application_signing_receipt_sha256: ${{ steps.verify.outputs.application_signing_receipt_sha256 }}
      application_signing_request_sha256: ${{ steps.verify.outputs.application_signing_request_sha256 }}
    steps:
      - name: Verify protected main, source run, artifacts, and digests
        id: verify
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUN_ID: ${{ inputs.application_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.application_run_attempt }}
          INSTALLER_ENVELOPE_NAME: ${{ inputs.installer_envelope_artifact }}
          INSTALLER_ENVELOPE_DIGEST: ${{ inputs.installer_envelope_digest }}
          INSTALLER_REQUEST_NAME: ${{ inputs.installer_request_artifact }}
          INSTALLER_REQUEST_DIGEST: ${{ inputs.installer_request_digest }}
          APPLICATION_HANDOFF: ${{ inputs.application_handoff }}
          INSTALLER_REQUEST_SHA256: ${{ inputs.installer_signing_request_sha256 }}
        run: |
          import json
          import os
          import re
          import urllib.request

          repository = "player1314520/defense-tracker-mvp"
          sha = os.environ["RELEASE_SHA"]
          run_id = os.environ["SOURCE_RUN_ID"]
          attempt = os.environ["SOURCE_RUN_ATTEMPT"]
          if re.fullmatch(r"^[0-9a-f]{40}$", sha) is None:
              raise SystemExit("Malformed release SHA")
          if re.fullmatch(r"[1-9][0-9]{0,18}", run_id) is None or re.fullmatch(r"[1-9][0-9]{0,18}", attempt) is None:
              raise SystemExit("Malformed source run identity")
          if re.fullmatch(r"[0-9a-f]{64}", os.environ["INSTALLER_REQUEST_SHA256"]) is None:
              raise SystemExit("Malformed installer request SHA-256 input")
          try:
              handoff = json.loads(os.environ["APPLICATION_HANDOFF"])
          except (TypeError, ValueError) as error:
              raise SystemExit("Application handoff is not valid JSON") from error
          handoff_keys = {
              "application_signed_artifact",
              "application_signed_digest",
              "application_receipt_artifact",
              "application_receipt_digest",
              "application_signing_receipt_sha256",
              "application_signing_request_sha256",
          }
          if not isinstance(handoff, dict) or set(handoff) != handoff_keys:
              raise SystemExit("Application handoff has unexpected fields")
          for name in ("application_signing_receipt_sha256", "application_signing_request_sha256"):
              if not isinstance(handoff[name], str) or re.fullmatch(r"[0-9a-f]{64}", handoff[name]) is None:
                  raise SystemExit("Application handoff SHA-256 is malformed")
          for name in ("application_signed_digest", "application_receipt_digest"):
              if not isinstance(handoff[name], str) or re.fullmatch(r"sha256:[0-9a-f]{64}", handoff[name]) is None:
                  raise SystemExit("Application handoff artifact digest is malformed")
          for name in ("application_signed_artifact", "application_receipt_artifact"):
              if not isinstance(handoff[name], str) or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,119}", handoff[name]) is None:
                  raise SystemExit("Application handoff artifact name is malformed")

          def api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "DefenseTracker-installer-gate",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = api(f"actions/runs/{run_id}")
          if (
              run.get("conclusion") != "success"
              or run.get("head_sha") != sha
              or run.get("head_branch") != "main"
              or run.get("path") != ".github/workflows/v9-application-signing.yml"
              or run.get("event") != "workflow_dispatch"
              or str(run.get("run_attempt")) != attempt
          ):
              raise SystemExit("Application-signing run provenance is not trusted")
          artifacts = api(f"actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
          expected = {
              os.environ["INSTALLER_ENVELOPE_NAME"]: os.environ["INSTALLER_ENVELOPE_DIGEST"],
              os.environ["INSTALLER_REQUEST_NAME"]: os.environ["INSTALLER_REQUEST_DIGEST"],
              handoff["application_signed_artifact"]: handoff["application_signed_digest"],
              handoff["application_receipt_artifact"]: handoff["application_receipt_digest"],
          }
          for artifact_name, digest in expected.items():
              matches = [a for a in artifacts if a.get("name") == artifact_name and not a.get("expired")]
              if len(matches) != 1 or matches[0].get("digest") != digest:
                  raise SystemExit("Exact source artifact identity mismatch")
          if api("git/ref/heads/main").get("object", {}).get("sha") != sha:
              raise SystemExit("Release SHA is no longer protected main")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in sorted(handoff):
                  output.write(f"{name}={handoff[name]}\n")

  sign-installer:
    name: Sign only the exact reviewed installer target
    needs: verify-installer-request
    environment:
      name: v9-installer-signing-review
      url: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.application_run_id }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      signed_installer_name: ${{ steps.identities.outputs.signed_installer_name }}
      signed_installer_digest: ${{ steps.signed_installer.outputs.artifact-digest }}
      installer_receipt_name: ${{ steps.identities.outputs.installer_receipt_name }}
      installer_receipt_digest: ${{ steps.installer_receipt.outputs.artifact-digest }}
      installer_receipt_sha256: ${{ steps.seal.outputs.installer_receipt_sha256 }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      SOURCE_RUN_ID: ${{ inputs.application_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.application_run_attempt }}
      REQUEST_SHA256: ${{ inputs.installer_signing_request_sha256 }}
      SIGNING_PROVIDER: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER }}
      TIMESTAMP_URL: ${{ vars.DEFENSE_TRACKER_TIMESTAMP_URL }}
      AZURE_ENDPOINT: ${{ vars.DEFENSE_TRACKER_AZURE_SIGNING_ENDPOINT }}
      AZURE_ACCOUNT_NAME: ${{ vars.DEFENSE_TRACKER_AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_PROFILE_NAME: ${{ vars.DEFENSE_TRACKER_AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
      DIGICERT_SM_HOST: ${{ vars.DIGICERT_SM_HOST }}
      DIGICERT_KEY_ALIAS: ${{ vars.DEFENSE_TRACKER_DIGICERT_KEY_ALIAS }}
    steps:
      - name: Download exact encrypted installer bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.installer_envelope_artifact }}
          path: ${{ runner.temp }}\source-envelope
          repository: ${{ github.repository }}
          run-id: ${{ inputs.application_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact public installer request
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.installer_request_artifact }}
          path: ${{ runner.temp }}\public-request
          repository: ${{ github.repository }}
          run-id: ${{ inputs.application_run_id }}
          github-token: ${{ github.token }}
      - name: Bootstrap only hash-pinned age, SignTool, and Azure DLib
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$ProgressPreference='SilentlyContinue'
          $root=Join-Path $env:RUNNER_TEMP 'signer-tools';New-Item -ItemType Directory $root|Out-Null
          function Expand-Pinned($uri,$sha,$name){$a=Join-Path $root "$name.zip";$d=Join-Path $root $name;Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $a;if((Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant()-cne$sha){throw "$name digest mismatch."};New-Item -ItemType Directory $d|Out-Null;[IO.Compression.ZipFile]::ExtractToDirectory($a,$d);return $d}
          $ageRoot=Expand-Pinned "https://github.com/FiloSottile/age/releases/download/v$env:AGE_VERSION/age-v$env:AGE_VERSION-windows-amd64.zip" $env:AGE_ARCHIVE_SHA256 'age'
          $age=@(Get-ChildItem $ageRoot -Filter age.exe -File -Recurse);if($age.Count-ne 1 -or (&$age[0].FullName --version)-cne"v$env:AGE_VERSION"){throw 'age identity mismatch.'}
          $sdk=Expand-Pinned "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.buildtools/$env:SDK_PACKAGE_VERSION/microsoft.windows.sdk.buildtools.$env:SDK_PACKAGE_VERSION.nupkg" $env:SDK_PACKAGE_SHA256 'sdk'
          $tool=@(Get-ChildItem $sdk -Filter signtool.exe -File -Recurse|Where-Object FullName -Match '[\\/]x64[\\/]signtool\.exe$');if($tool.Count-ne 1){throw 'SignTool missing.'}
          "AGE_EXE=$($age[0].FullName)"|Add-Content $env:GITHUB_ENV -Encoding utf8;"SIGNTOOL_EXE=$($tool[0].FullName)"|Add-Content $env:GITHUB_ENV -Encoding utf8
          if($env:SIGNING_PROVIDER-ceq'AzureArtifactSigning'){$azure=Expand-Pinned "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:AZURE_CLIENT_VERSION/microsoft.artifactsigning.client.$env:AZURE_CLIENT_VERSION.nupkg" $env:AZURE_CLIENT_SHA256 'azure';$dlib=Join-Path $azure 'bin\x64\Azure.CodeSigning.Dlib.dll';if(-not(Test-Path $dlib)){throw 'Azure DLib missing.'};$metadata=Join-Path $root 'azure-metadata.json';[IO.File]::WriteAllText($metadata,(@{Endpoint=$env:AZURE_ENDPOINT;CodeSigningAccountName=$env:AZURE_ACCOUNT_NAME;CertificateProfileName=$env:AZURE_PROFILE_NAME;CorrelationId="$env:GITHUB_REPOSITORY/$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT/$env:RELEASE_SHA/installer"}|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false));"AZURE_DLIB=$dlib"|Add-Content $env:GITHUB_ENV -Encoding utf8;"AZURE_METADATA=$metadata"|Add-Content $env:GITHUB_ENV -Encoding utf8;"AZURE_METADATA_SHA256=$((Get-FileHash $metadata -Algorithm SHA256).Hash.ToLowerInvariant())"|Add-Content $env:GITHUB_ENV -Encoding utf8}
      - name: Decrypt exact installer and remove one-use identity
        shell: pwsh
        env:
          CANDIDATE_AGE_IDENTITY: ${{ secrets.RELEASE_ARTIFACT_AGE_IDENTITY }}
        run: |
          $envelope=Join-Path $env:RUNNER_TEMP 'source-envelope';$entries=@(Get-ChildItem $envelope -Force);$cipher=@($entries|Where-Object{-not$_.PSIsContainer-and$_.Name-like'*.age'});if($entries.Count-ne3-or$cipher.Count-ne1){throw 'Envelope is not exact.'};$transport=Get-Content (Join-Path $envelope 'candidate-transport-receipt.json') -Raw|ConvertFrom-Json;if($transport.ciphertext_sha256-cne(Get-FileHash $cipher[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()){throw 'Ciphertext mismatch.'};$id=Join-Path $env:RUNNER_TEMP ("age-"+[guid]::NewGuid().ToString('N')+'.txt');$archive=Join-Path $env:RUNNER_TEMP 'installer.zip';try{[IO.File]::WriteAllText($id,$env:CANDIDATE_AGE_IDENTITY.Trim()+"`n",[Text.UTF8Encoding]::new($false));&$env:AGE_EXE --decrypt --identity $id --output $archive $cipher[0].FullName;if($LASTEXITCODE-ne0){throw 'decrypt failed.'}}finally{if(Test-Path $id){Remove-Item $id -Force}};if($transport.plaintext_archive_sha256-cne(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()){throw 'Archive mismatch.'}
      - name: Expand and validate unsigned installer without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=Join-Path $env:RUNNER_TEMP 'installer-bundle';New-Item -ItemType Directory $root|Out-Null;$zip=[IO.Compression.ZipFile]::OpenRead((Join-Path $env:RUNNER_TEMP 'installer.zip'));try{foreach($entry in $zip.Entries){if($entry.FullName-cnotmatch'^payload/[^\\:]+$'-or$entry.FullName.EndsWith('/')){throw 'unsafe ZIP.'};$relative=$entry.FullName.Substring(8);if($relative-match'(^|/)\.\.?(/|$)'){throw 'unsafe segment.'};$path=[IO.Path]::GetFullPath((Join-Path $root $relative));if(-not$path.StartsWith([IO.Path]::GetFullPath($root).TrimEnd('\')+'\')){throw 'ZIP escape.'};New-Item -ItemType Directory (Split-Path $path -Parent)-Force|Out-Null;$a=$entry.Open();$b=[IO.File]::Create($path);try{$a.CopyTo($b)}finally{$b.Dispose();$a.Dispose()}}}finally{$zip.Dispose()}
          $public=Join-Path $env:RUNNER_TEMP 'public-request\installer-signing-request.json';$internal=Join-Path $root 'signing-request.json';if((Get-FileHash $public -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:REQUEST_SHA256-or-not[Linq.Enumerable]::SequenceEqual([byte[]][IO.File]::ReadAllBytes($public),[byte[]][IO.File]::ReadAllBytes($internal))){throw 'request mismatch.'};$request=Get-Content $internal -Raw|ConvertFrom-Json;$expectedTarget='payload/DefenseTracker-Setup-v9.0.0-windows-x64.exe';$expectedWorkflow="$env:GITHUB_REPOSITORY/.github/workflows/v9-application-signing.yml@refs/heads/main";if($request.schema-ne2-or$request.kind-cne'defense-tracker-authenticode-signing-request'-or$request.subject_kind-cne'installer'-or$request.release.commit-cne$env:RELEASE_SHA-or$request.release.version-cne'9.0.0'-or$request.provenance.repository-cne$env:GITHUB_REPOSITORY-or$request.provenance.workflow_ref-cne$expectedWorkflow-or$request.provenance.job-cne'prepare-unsigned-installer'-or$request.provenance.run_id-ne[int64]$env:SOURCE_RUN_ID-or$request.provenance.run_attempt-ne[int64]$env:SOURCE_RUN_ATTEMPT-or$request.target.path-cne$expectedTarget-or$request.target.signature_state-cne'unsigned'){throw 'request identity mismatch.'};$target=Join-Path $root ($request.target.path.Replace('/','\'));if((Get-Item $target).Length-ne[int64]$request.target.bytes-or(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()-cne$request.target.sha256-or(Get-AuthenticodeSignature $target).Status-ne[Management.Automation.SignatureStatus]::NotSigned){throw 'unsigned target mismatch.'};$actual=@(Get-ChildItem $root -File -Recurse|Where-Object{$_.Name-notin@('signing-request.json','signing-receipt.json')}|ForEach-Object{[ordered]@{path=$_.FullName.Substring($root.Length).TrimStart('\').Replace('\','/');bytes=[int64]$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}}|Sort-Object path);if(($actual|ConvertTo-Json -Depth 4 -Compress)-cne(@($request.payload_files)|ConvertTo-Json -Depth 4 -Compress)){throw 'Installer payload inventory mismatch.'}
          $policyPath=Join-Path $env:RUNNER_TEMP 'publisher-policy.json'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:RELEASE_SHA/release/publisher-policy.json" -OutFile $policyPath
          $policySha=(Get-FileHash $policyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $policy=Get-Content $policyPath -Raw|ConvertFrom-Json
          $providerPolicy=$policy.providers.$($env:SIGNING_PROVIDER)
          if($policy.status-cne'approved'-or$policy.active_provider-notin@('AzureArtifactSigning','DigiCertKeyLocker')-or$policy.active_provider-cne$env:SIGNING_PROVIDER-or[string]::IsNullOrWhiteSpace([string]$policy.publisher)-or$policy.publisher-cne$request.release.publisher-or$providerPolicy.status-cne'approved'-or@($providerPolicy.expected_subjects).Count-lt1-or@($providerPolicy.expected_issuers).Count-lt1-or@($providerPolicy.expected_root_sha256).Count-lt1){throw 'Publisher policy is not approved and fully pinned.'}
          if($env:SIGNING_PROVIDER-ceq'AzureArtifactSigning'){
            if($providerPolicy.endpoint-cne$env:AZURE_ENDPOINT-or$providerPolicy.account_name-cne$env:AZURE_ACCOUNT_NAME-or$providerPolicy.certificate_profile_name-cne$env:AZURE_PROFILE_NAME-or$providerPolicy.public_trust_eku-cne'1.3.6.1.4.1.311.97.1.0'-or$providerPolicy.code_signing_eku-cne'1.3.6.1.5.5.7.3.3'-or$providerPolicy.forbidden_test_eku-cne'1.3.6.1.4.1.311.10.3.13'-or$providerPolicy.leaf_spki_policy-cne'record-only'-or[string]$providerPolicy.durable_identity_eku-cnotmatch'^1\.3\.6\.1\.4\.1\.311\.97\.(?:[0-9]+\.)+[0-9]+$'-or$providerPolicy.durable_identity_eku-ceq$providerPolicy.public_trust_eku-or[string]$providerPolicy.durable_identity_eku-match'^1\.3\.6\.1\.4\.1\.311\.97\.1\.(?:3|4)\.1(?:\.|$)'){throw 'Azure configuration or durable identity policy differs from committed policy.'}
          }else{
            if($providerPolicy.sm_host-cne$env:DIGICERT_SM_HOST-or$providerPolicy.key_alias-cne$env:DIGICERT_KEY_ALIAS-or[string]$providerPolicy.certificate_file_sha256-cnotmatch'^[0-9a-f]{64}$'-or$providerPolicy.code_signing_eku-cne'1.3.6.1.5.5.7.3.3'-or$providerPolicy.leaf_spki_policy-cne'required-pin'-or@($providerPolicy.expected_spki_sha256).Count-ne@($providerPolicy.expected_subjects).Count){throw 'DigiCert host, key alias, certificate, or identity pins differ from committed policy.'}
            try{$smHost=[Uri][string]$providerPolicy.sm_host}catch{throw 'Committed DigiCert SM host is malformed.'}
            if(-not$smHost.IsAbsoluteUri-or$smHost.Scheme-cne'https'-or-not[string]::IsNullOrEmpty($smHost.UserInfo)-or-not[string]::IsNullOrEmpty($smHost.Query)-or-not[string]::IsNullOrEmpty($smHost.Fragment)-or$smHost.AbsoluteUri-cne[string]$providerPolicy.sm_host){throw 'Committed DigiCert SM host is not a canonical credential-free HTTPS URI.'}
            "SM_HOST=$($providerPolicy.sm_host)"|Add-Content $env:GITHUB_ENV -Encoding utf8
            "VALIDATED_DIGICERT_KEY_ALIAS=$($providerPolicy.key_alias)"|Add-Content $env:GITHUB_ENV -Encoding utf8
            "DIGICERT_CERTIFICATE_FILE_SHA256=$($providerPolicy.certificate_file_sha256)"|Add-Content $env:GITHUB_ENV -Encoding utf8
          }
          "PUBLISHER_POLICY_SHA256=$policySha"|Add-Content $env:GITHUB_ENV -Encoding utf8
          "TARGET_PATH=$target"|Add-Content $env:GITHUB_ENV -Encoding utf8;"BUNDLE_ROOT=$root"|Add-Content $env:GITHUB_ENV -Encoding utf8;"UNSIGNED_SHA256=$($request.target.sha256)"|Add-Content $env:GITHUB_ENV -Encoding utf8;"TARGET_RELATIVE=$($request.target.path)"|Add-Content $env:GITHUB_ENV -Encoding utf8;"PUBLISHER=$($request.release.publisher)"|Add-Content $env:GITHUB_ENV -Encoding utf8;"POLICY_PATH=$policyPath"|Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Authenticate Azure immediately before installer signing
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'AzureArtifactSigning' }}
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign exact installer with Azure SignTool
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'AzureArtifactSigning' }}
        shell: pwsh
        run: |
          if((Get-FileHash $env:TARGET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:UNSIGNED_SHA256){throw 'Target changed before signing.'};&$env:SIGNTOOL_EXE sign /v /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 /dlib $env:AZURE_DLIB /dmdf $env:AZURE_METADATA $env:TARGET_PATH;if($LASTEXITCODE-ne0){throw 'Azure installer signing failed.'}
      - name: Materialize and validate exact DigiCert public certificate
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'DigiCertKeyLocker' }}
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_B64: ${{ secrets.DIGICERT_SIGNING_CERT_FILE_B64 }}
        run: |
          $certificatePath=Join-Path $env:RUNNER_TEMP 'digicert-signing.cer'
          [IO.File]::WriteAllBytes($certificatePath,[Convert]::FromBase64String($env:SIGNING_CERTIFICATE_B64))
          if((Get-FileHash $certificatePath -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:DIGICERT_CERTIFICATE_FILE_SHA256){throw 'DigiCert public certificate differs from committed certificate-file pin.'}
          $certificate=[Security.Cryptography.X509Certificates.X509Certificate2]::new([IO.File]::ReadAllBytes($certificatePath))
          $policy=Get-Content $env:POLICY_PATH -Raw|ConvertFrom-Json;$providerPolicy=$policy.providers.DigiCertKeyLocker
          $subject=$certificate.SubjectName.Decode([Security.Cryptography.X509Certificates.X500DistinguishedNameFlags]::UseCommas).Trim();$spki=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($certificate.PublicKey.ExportSubjectPublicKeyInfo())).ToLowerInvariant()
          if($certificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName,$false)-cne$policy.publisher-or$subject-notin@($providerPolicy.expected_subjects)-or$spki-notin@($providerPolicy.expected_spki_sha256)){throw 'DigiCert public certificate identity is outside committed policy.'}
      - name: Materialize DigiCert authentication immediately before signing
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'DigiCertKeyLocker' }}
        shell: pwsh
        env:
          CLIENT_CERTIFICATE_B64: ${{ secrets.DIGICERT_SM_CLIENT_CERT_FILE_B64 }}
        run: |
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'digicert-client.p12'),[Convert]::FromBase64String($env:CLIENT_CERTIFICATE_B64))
      - name: Authenticate DigiCert immediately before installer signing
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'DigiCertKeyLocker' }}
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        env:
          SM_API_KEY: ${{ secrets.DIGICERT_SM_API_KEY }}
          SM_CLIENT_CERT_FILE: ${{ runner.temp }}\digicert-client.p12
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.DIGICERT_SM_CLIENT_CERT_PASSWORD }}
      - name: Sign exact installer with DigiCert SignTool
        if: ${{ vars.DEFENSE_TRACKER_SIGNING_PROVIDER == 'DigiCertKeyLocker' }}
        shell: pwsh
        run: |
          if((Get-FileHash $env:TARGET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:UNSIGNED_SHA256){throw 'Target changed before signing.'};if((Get-FileHash (Join-Path $env:RUNNER_TEMP 'digicert-signing.cer') -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:DIGICERT_CERTIFICATE_FILE_SHA256){throw 'DigiCert certificate changed before signing.'};&$env:SIGNTOOL_EXE sign /v /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 /csp 'DigiCert Signing Manager KSP' /kc $env:VALIDATED_DIGICERT_KEY_ALIAS /f (Join-Path $env:RUNNER_TEMP 'digicert-signing.cer') $env:TARGET_PATH;if($LASTEXITCODE-ne0){throw 'DigiCert installer signing failed.'}
