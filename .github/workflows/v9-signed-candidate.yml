          if($env:SIGNING_PROVIDER-ceq'AzureArtifactSigning'){foreach($requiredOid in @($providerPolicy.public_trust_eku,$providerPolicy.durable_identity_eku)){if(@($ekuOids|Where-Object{$_-ceq$requiredOid}).Count-ne1){throw "Azure signer certificate lacks required EKU $requiredOid."}};if(@($ekuOids|Where-Object{$_-ceq$providerPolicy.forbidden_test_eku}).Count-ne0){throw 'Azure signer certificate contains the forbidden Public Trust test EKU.'}}
          $now=[DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $policyEvidence=if($env:SIGNING_PROVIDER-ceq'AzureArtifactSigning'){[ordered]@{azure_account_name=$providerPolicy.account_name;azure_certificate_profile_name=$providerPolicy.certificate_profile_name;azure_endpoint=$providerPolicy.endpoint;azure_metadata_sha256=$env:AZURE_METADATA_SHA256;digicert_key_alias=$null;digicert_sm_host=$null;durable_identity_eku=$providerPolicy.durable_identity_eku;leaf_spki_policy='record-only';sha256=$env:PUBLISHER_POLICY_SHA256}}else{[ordered]@{azure_account_name=$null;azure_certificate_profile_name=$null;azure_endpoint=$null;azure_metadata_sha256=$null;digicert_key_alias=$providerPolicy.key_alias;digicert_sm_host=$providerPolicy.sm_host;durable_identity_eku=$null;leaf_spki_policy='required-pin';sha256=$env:PUBLISHER_POLICY_SHA256}}
          $receipt=[ordered]@{completed_at_utc=$now;kind='defense-tracker-authenticode-signing-receipt';provenance=[ordered]@{job='sign-installer';repository=$env:GITHUB_REPOSITORY;run_attempt=[int64]$env:GITHUB_RUN_ATTEMPT;run_id=[int64]$env:GITHUB_RUN_ID;workflow_ref=$env:GITHUB_WORKFLOW_REF};release_commit=$env:RELEASE_SHA;request_sha256=$env:REQUEST_SHA256;schema=2;signature=[ordered]@{provider=$env:SIGNING_PROVIDER;publisher=$env:PUBLISHER;publisher_policy=$policyEvidence;signer_issuer_subject=$issuer;signer_root_sha256=$rootSha;signer_spki_sha256=$spki;signer_subject=$subject;timestamp_certificate_subject=$signature.TimeStamperCertificate.Subject;timestamp_url=$env:TIMESTAMP_URL;timestamp_verified_at_utc=$now};signed_bytes=[int64](Get-Item $env:TARGET_PATH).Length;signed_sha256=(Get-FileHash $env:TARGET_PATH -Algorithm SHA256).Hash.ToLowerInvariant();subject_kind='installer';target_path=$env:TARGET_RELATIVE;unsigned_sha256=$env:UNSIGNED_SHA256}
          $receiptPath=Join-Path $env:BUNDLE_ROOT 'signing-receipt.json';[IO.File]::WriteAllText($receiptPath,($receipt|ConvertTo-Json -Depth 8 -Compress)+"`n",[Text.UTF8Encoding]::new($false))
          $public=Join-Path $env:RUNNER_TEMP 'installer-receipt-public';New-Item -ItemType Directory $public|Out-Null;Copy-Item $receiptPath (Join-Path $public 'installer-signing-receipt.json');"installer_receipt_sha256=$((Get-FileHash $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant())"|Add-Content $env:GITHUB_OUTPUT -Encoding utf8
          $recipient=Join-Path $env:RUNNER_TEMP 'recipient.txt';Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:RELEASE_SHA/release/candidate-transport-recipient.txt" -OutFile $recipient;$name="DefenseTracker-v9.0.0-installer-signed-$env:RELEASE_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT";$archive=Join-Path $env:RUNNER_TEMP 'signed-installer.zip';$zip=[IO.Compression.ZipFile]::Open($archive,[IO.Compression.ZipArchiveMode]::Create);try{foreach($file in @(Get-ChildItem $env:BUNDLE_ROOT -File -Recurse|Sort-Object FullName)){$relative=$file.FullName.Substring($env:BUNDLE_ROOT.Length).TrimStart('\').Replace('\','/');$entry=$zip.CreateEntry("payload/$relative",[IO.Compression.CompressionLevel]::Optimal);$entry.LastWriteTime=[DateTimeOffset]::new(1980,1,1,0,0,0,[TimeSpan]::Zero);$a=$file.OpenRead();$b=$entry.Open();try{$a.CopyTo($b)}finally{$b.Dispose();$a.Dispose()}}}finally{$zip.Dispose()};$out=Join-Path $env:RUNNER_TEMP 'signed-installer-envelope';New-Item -ItemType Directory $out|Out-Null;$cipherName="$name.age";$cipher=Join-Path $out $cipherName;&$env:AGE_EXE --encrypt --recipients-file $recipient --output $cipher $archive;if($LASTEXITCODE-ne0){throw 'Encryption failed.'};$transportRequest=[ordered]@{artifact_name=$name;recipient_file_sha256=(Get-FileHash $recipient -Algorithm SHA256).Hash.ToLowerInvariant();release_commit=$env:RELEASE_SHA;repository=$env:GITHUB_REPOSITORY;run_attempt=[string]$env:GITHUB_RUN_ATTEMPT;run_id=[string]$env:GITHUB_RUN_ID;schema='defense-tracker-candidate-transport-request-v1'};$transportRequestPath=Join-Path $out 'candidate-transport-request.json';[IO.File]::WriteAllText($transportRequestPath,($transportRequest|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false));$transportReceipt=[ordered]@{ciphertext_file=$cipherName;ciphertext_sha256=(Get-FileHash $cipher -Algorithm SHA256).Hash.ToLowerInvariant();ciphertext_size=[string](Get-Item $cipher).Length;plaintext_archive_sha256=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant();plaintext_archive_size=[string](Get-Item $archive).Length;request_file='candidate-transport-request.json';request_sha256=(Get-FileHash $transportRequestPath -Algorithm SHA256).Hash.ToLowerInvariant();schema='defense-tracker-candidate-transport-receipt-v1'};[IO.File]::WriteAllText((Join-Path $out 'candidate-transport-receipt.json'),($transportReceipt|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false))
      - name: Set signed-installer artifact identities
        id: identities
        shell: pwsh
        run: |
          "signed_installer_name=DefenseTracker-v9.0.0-installer-signed-$env:RELEASE_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"|Add-Content $env:GITHUB_OUTPUT -Encoding utf8
          "installer_receipt_name=DefenseTracker-v9.0.0-installer-signing-receipt-$env:RELEASE_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"|Add-Content $env:GITHUB_OUTPUT -Encoding utf8
      - name: Attest only ciphertext and public receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}\signed-installer-envelope\*
            ${{ runner.temp }}\installer-receipt-public\installer-signing-receipt.json
      - name: Upload encrypted signed installer
        id: signed_installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identities.outputs.signed_installer_name }}
          path: ${{ runner.temp }}\signed-installer-envelope\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          include-hidden-files: false
      - name: Upload public installer receipt
        id: installer_receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identities.outputs.installer_receipt_name }}
          path: ${{ runner.temp }}\installer-receipt-public\installer-signing-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          include-hidden-files: false

  finalize-signed-candidate:
    name: Credentiallessly finalize and encrypt fixed release assets
    needs: [verify-installer-request, sign-installer]
    environment:
      name: v9-candidate-processing
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      APPLICATION_REQUEST_SHA256: ${{ needs.verify-installer-request.outputs.application_signing_request_sha256 }}
      INSTALLER_REQUEST_SHA256: ${{ inputs.installer_signing_request_sha256 }}
      APPLICATION_RECEIPT_SHA256: ${{ needs.verify-installer-request.outputs.application_signing_receipt_sha256 }}
      INSTALLER_RECEIPT_SHA256: ${{ needs.sign-installer.outputs.installer_receipt_sha256 }}
      APPLICATION_RUN_ID: ${{ inputs.application_run_id }}
      APPLICATION_RUN_ATTEMPT: ${{ inputs.application_run_attempt }}
    steps:
      - name: Set one-use final candidate root
        shell: pwsh
        run: |
          "OUTPUT_ROOT=${{ runner.temp }}\final-candidate" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Download encrypted signed application
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify-installer-request.outputs.application_signed_artifact }}
          path: ${{ runner.temp }}\application-envelope
          repository: ${{ github.repository }}
          run-id: ${{ inputs.application_run_id }}
          github-token: ${{ github.token }}
      - name: Download public application receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify-installer-request.outputs.application_receipt_artifact }}
          path: ${{ runner.temp }}\application-receipt
          repository: ${{ github.repository }}
          run-id: ${{ inputs.application_run_id }}
          github-token: ${{ github.token }}
      - name: Download encrypted signed installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-installer.outputs.signed_installer_name }}
          path: ${{ runner.temp }}\installer-envelope
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Download public installer receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign-installer.outputs.installer_receipt_name }}
          path: ${{ runner.temp }}\installer-receipt
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Bootstrap pinned age without checkout
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'age';New-Item -ItemType Directory $root|Out-Null;$archive=Join-Path $root 'age.zip';Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/FiloSottile/age/releases/download/v$env:AGE_VERSION/age-v$env:AGE_VERSION-windows-amd64.zip" -OutFile $archive;if((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()-cne$env:AGE_ARCHIVE_SHA256){throw 'age digest mismatch.'};[IO.Compression.ZipFile]::ExtractToDirectory($archive,(Join-Path $root 'expanded'));$age=@(Get-ChildItem (Join-Path $root 'expanded') -Filter age.exe -File -Recurse);if($age.Count-ne1){throw 'age missing.'};"AGE_EXE=$($age[0].FullName)"|Add-Content $env:GITHUB_ENV -Encoding utf8
      - name: Decrypt both signed bundles and remove one-use identity
        shell: pwsh
        env:
          CANDIDATE_AGE_IDENTITY: ${{ secrets.RELEASE_ARTIFACT_AGE_IDENTITY }}
        run: |
          $identity=Join-Path $env:RUNNER_TEMP ("age-"+[guid]::NewGuid().ToString('N')+'.txt');try{[IO.File]::WriteAllText($identity,$env:CANDIDATE_AGE_IDENTITY.Trim()+"`n",[Text.UTF8Encoding]::new($false));foreach($name in @('application','installer')){$cipher=@(Get-ChildItem (Join-Path $env:RUNNER_TEMP "$name-envelope") -Filter *.age -File);if($cipher.Count-ne1){throw "$name ciphertext mismatch."};&$env:AGE_EXE --decrypt --identity $identity --output (Join-Path $env:RUNNER_TEMP "$name.zip") $cipher[0].FullName;if($LASTEXITCODE-ne0){throw "$name decryption failed."}}}finally{if(Test-Path $identity){Remove-Item $identity -Force}}
      - name: Safely expand signed bundles after identity removal
        shell: pwsh
        run: |
          foreach($name in @('application','installer')){$output=Join-Path $env:RUNNER_TEMP "$name-bundle";New-Item -ItemType Directory $output|Out-Null;$zip=[IO.Compression.ZipFile]::OpenRead((Join-Path $env:RUNNER_TEMP "$name.zip"));try{foreach($entry in $zip.Entries){if($entry.FullName-cnotmatch'^payload/[^\\:]+$'-or$entry.FullName.EndsWith('/')){throw 'unsafe ZIP.'};$relative=$entry.FullName.Substring(8);if($relative-match'(^|/)\.\.?(/|$)'){throw 'unsafe segment.'};$path=[IO.Path]::GetFullPath((Join-Path $output $relative));New-Item -ItemType Directory (Split-Path $path -Parent)-Force|Out-Null;$a=$entry.Open();$b=[IO.File]::Create($path);try{$a.CopyTo($b)}finally{$b.Dispose();$a.Dispose()}}}finally{$zip.Dispose()}}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Bootstrap credentialless verification tools
        shell: pwsh
        run: |
          .\scripts\Initialize-GitHubHostedReleaseTools.ps1 -Mode VerificationOnly
          .\scripts\Initialize-ReleaseArtifactCrypto.ps1
          .\scripts\Prepare-BuildEnv.ps1 -RequireExpectedPythonHash
      - name: Finalize exact candidate without any signing identity
        shell: pwsh
        run: |
          $policySha=(Get-FileHash .\release\publisher-policy.json -Algorithm SHA256).Hash.ToLowerInvariant()
          .\scripts\Finalize-SignedCandidate.ps1 `
            -ExpectedReleaseSha $env:RELEASE_SHA `
            -SignedApplicationBundleRoot (Join-Path $env:RUNNER_TEMP 'application-bundle') `
            -ApplicationSigningReceipt (Join-Path $env:RUNNER_TEMP 'application-receipt\application-signing-receipt.json') `
            -SignedInstallerBundleRoot (Join-Path $env:RUNNER_TEMP 'installer-bundle') `
            -InstallerSigningReceipt (Join-Path $env:RUNNER_TEMP 'installer-receipt\installer-signing-receipt.json') `
            -ApplicationSigningRequestSha256 $env:APPLICATION_REQUEST_SHA256 `
            -InstallerSigningRequestSha256 $env:INSTALLER_REQUEST_SHA256 `
            -ExpectedApplicationSigningReceiptSha256 $env:APPLICATION_RECEIPT_SHA256 `
            -ExpectedInstallerSigningReceiptSha256 $env:INSTALLER_RECEIPT_SHA256 `
            -ExpectedApplicationRunId $env:APPLICATION_RUN_ID `
            -ExpectedApplicationRunAttempt $env:APPLICATION_RUN_ATTEMPT `
            -ExpectedPublisherPolicySha256 $policySha `
            -OutputRoot $env:OUTPUT_ROOT
          .\.venv-build\Scripts\python.exe scripts\verify_release_assets.py `
            (Join-Path $env:OUTPUT_ROOT 'release-assets') `
            --expected-commit $env:RELEASE_SHA
      - name: Encrypt fixed candidate assets for public retention
        id: candidate
        shell: pwsh
        run: |
          $name="DefenseTracker-v9.0.0-candidate-$env:RELEASE_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          .\scripts\Protect-ReleaseArtifact.ps1 `
            -AgeExecutable $env:DEFENSE_TRACKER_AGE `
            -ExpectedAgeExecutableSha256 $env:DEFENSE_TRACKER_AGE_SHA256 `
            -PlaintextRoot (Join-Path $env:OUTPUT_ROOT 'release-assets') `
            -RecipientFile .\release\candidate-transport-recipient.txt `
            -OutputDirectory (Join-Path $env:OUTPUT_ROOT 'candidate-envelope') `
            -ArtifactName $name `
            -Repository $env:GITHUB_REPOSITORY `
            -ReleaseCommit $env:RELEASE_SHA `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT
          "candidate_name=$name"|Add-Content $env:GITHUB_OUTPUT -Encoding utf8
      - name: Upload encrypted final candidate
        id: candidate_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: ${{ env.OUTPUT_ROOT }}\candidate-envelope\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          include-hidden-files: false
      - name: Publish exact stable-verification handoff
        shell: pwsh
        env:
          CANDIDATE_NAME: ${{ steps.candidate.outputs.candidate_name }}
          CANDIDATE_DIGEST: ${{ steps.candidate_upload.outputs.artifact-digest }}
        run: |
          @('### V9 stable verification handoff','',"- candidate run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT``","- encrypted candidate artifact: ``$env:CANDIDATE_NAME``","- encrypted candidate artifact digest: ``$env:CANDIDATE_DIGEST``")|Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
