          $typedEku=[Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuExtension[0],$ekuExtension[0].Critical);$ekuOids=@($typedEku.EnhancedKeyUsages|ForEach-Object{$_.Value})
