name: V9 stable release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected main commit
        required: true
        type: string
      candidate_run_id:
        description: Successful V9 signed candidate run ID
        required: true
        type: string
      deployment_evidence_run_id:
        description: Successful V9 deployment verification run ID
        required: true
        type: string
      portal_image_digest:
        description: Exact production OCI sha256 digest
        required: true
        type: string
      portal_image_run_id:
        description: Successful protected-main Portal image workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: read

concurrency:
  group: v9-stable-release
  cancel-in-progress: false

jobs:
  publish-stable-release:
    name: Reverify, attest and publish immutable release
    if: github.ref == 'refs/heads/main'
    environment: v9-production-release
    # Stable publication is isolated from the candidate builder and requires a
    # separately managed one-job runner registered with --ephemeral.
    runs-on: [self-hosted, Windows, X64, defense-v9-stable-ephemeral]
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      DEPLOYMENT_EVIDENCE_RUN_ID: ${{ inputs.deployment_evidence_run_id }}
      PORTAL_IMAGE_DIGEST: ${{ inputs.portal_image_digest }}
      PORTAL_IMAGE_RUN_ID: ${{ inputs.portal_image_run_id }}
      DEFENSE_TRACKER_PUBLISHER: ${{ vars.DEFENSE_TRACKER_PUBLISHER }}
      DEFENSE_TRACKER_SIGNTOOL: ${{ vars.DEFENSE_TRACKER_SIGNTOOL }}
      DEFENSE_TRACKER_SIGNTOOL_SHA256: ${{ vars.DEFENSE_TRACKER_SIGNTOOL_SHA256 }}
      DEFENSE_TRACKER_EXPECTED_SIGNER_SUBJECTS: ${{ vars.DEFENSE_TRACKER_EXPECTED_SIGNER_SUBJECTS }}
      DEFENSE_TRACKER_EXPECTED_SIGNER_SPKI_SHA256: ${{ vars.DEFENSE_TRACKER_EXPECTED_SIGNER_SPKI_SHA256 }}
      DEFENSE_TRACKER_EXPECTED_SIGNER_ISSUERS: ${{ vars.DEFENSE_TRACKER_EXPECTED_SIGNER_ISSUERS }}
      DEFENSE_TRACKER_EXPECTED_SIGNER_ROOT_SHA256: ${{ vars.DEFENSE_TRACKER_EXPECTED_SIGNER_ROOT_SHA256 }}
      DEFENSE_TRACKER_EPHEMERAL_RUNNER_MODE: ${{ vars.DEFENSE_TRACKER_EPHEMERAL_RUNNER_MODE }}
      DEPLOYMENT_COLLECTOR_KEY_ID: ${{ vars.DEFENSE_TRACKER_DEPLOYMENT_COLLECTOR_KEY_ID }}
      DEPLOYMENT_COLLECTOR_PUBLIC_KEY_SHA256: ${{ vars.DEFENSE_TRACKER_DEPLOYMENT_COLLECTOR_PUBLIC_KEY_SHA256 }}
      DEPLOYMENT_STAGING_ORIGIN: ${{ vars.DEFENSE_TRACKER_STAGING_ORIGIN }}
      DEPLOYMENT_PRODUCTION_ORIGIN: ${{ vars.DEFENSE_TRACKER_PRODUCTION_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Require exact current main, protected checks and trusted source workflows
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:DEFENSE_TRACKER_EPHEMERAL_RUNNER_MODE -cne 'ephemeral') {
            throw "The production release environment has not declared an ephemeral runner."
          }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') { throw "Invalid release SHA." }
          if ($env:PORTAL_IMAGE_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid image digest." }
          if ($env:PORTAL_IMAGE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') { throw "Invalid Portal image run ID." }
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') { throw "Invalid candidate run ID." }
          if ($env:DEPLOYMENT_EVIDENCE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') { throw "Invalid evidence run ID." }
          if ($env:DEPLOYMENT_COLLECTOR_KEY_ID -notmatch '^deployment-collector-[0-9a-f]{16}$') { throw "Invalid deployment collector key ID." }
          if ($env:DEPLOYMENT_COLLECTOR_PUBLIC_KEY_SHA256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid deployment collector public-key digest." }
          $originPattern = '^https://(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}(?::443)?$'
          if ($env:DEPLOYMENT_STAGING_ORIGIN -cnotmatch $originPattern) { throw "Invalid protected staging origin." }
          if ($env:DEPLOYMENT_PRODUCTION_ORIGIN -cnotmatch $originPattern) { throw "Invalid protected production origin." }
          if ($env:DEPLOYMENT_STAGING_ORIGIN -ceq $env:DEPLOYMENT_PRODUCTION_ORIGIN) { throw "Protected deployment origins must differ." }
          if ($env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_SHA -cne $env:RELEASE_SHA) {
            throw "Stable workflow must be dispatched from the exact protected main commit."
          }
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw "Checkout mismatch." }
          git fetch --no-tags origin main
          if ((git rev-parse refs/remotes/origin/main) -ne $env:RELEASE_SHA) { throw "Release is not current main." }
          python scripts/verify_release_checks.py `
            --repository $env:GITHUB_REPOSITORY `
            --sha $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Required protected checks are not green." }
          $candidate = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if ($candidate.conclusion -ne 'success' -or
              $candidate.head_sha -ne $env:RELEASE_SHA -or
              $candidate.head_branch -ne 'main' -or
              $candidate.path -ne '.github/workflows/v9-signed-candidate.yml' -or
              $candidate.event -ne 'workflow_dispatch') {
            throw "Candidate run is not the trusted workflow for this commit."
          }
          $evidence = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:DEPLOYMENT_EVIDENCE_RUN_ID" | ConvertFrom-Json
          if ($evidence.conclusion -ne 'success' -or
              $evidence.head_sha -ne $env:RELEASE_SHA -or
              $evidence.head_branch -ne 'main' -or
              $evidence.path -ne '.github/workflows/v9-deployment-evidence.yml' -or
              $evidence.event -ne 'workflow_dispatch') {
            throw "Deployment evidence run is not trusted for this commit."
          }
          $portalImage = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:PORTAL_IMAGE_RUN_ID" | ConvertFrom-Json
          if ($portalImage.conclusion -ne 'success' -or
              $portalImage.head_sha -ne $env:RELEASE_SHA -or
              $portalImage.head_branch -ne 'main' -or
              $portalImage.path -ne '.github/workflows/v9-portal-image.yml' -or
              $portalImage.event -ne 'workflow_dispatch') {
            throw "Portal image run is not trusted for this commit."
          }
      - name: Download exact signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DefenseTracker-v9.0.0-${{ inputs.release_sha }}
          path: candidate
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact live deployment evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v9-deployment-evidence-${{ inputs.release_sha }}
          path: deployment-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deployment_evidence_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact Portal image receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v9-portal-image-${{ inputs.release_sha }}-${{ inputs.portal_image_run_id }}
          path: portal-image-receipt
          repository: ${{ github.repository }}
          run-id: ${{ inputs.portal_image_run_id }}
          github-token: ${{ github.token }}
      - name: Verify Portal image receipt and OCI provenance
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $receiptFiles = @(Get-ChildItem portal-image-receipt -Recurse -Force)
          if ($receiptFiles.Count -ne 1 -or $receiptFiles[0].PSIsContainer -or
              $receiptFiles[0].LinkType -or $receiptFiles[0].Name -cne 'portal-image.json') {
            throw "Portal image workflow did not publish the one fixed receipt."
          }
          $receipt = Get-Content -LiteralPath $receiptFiles[0].FullName -Raw | ConvertFrom-Json
          $expectedKeys = @('attestation_url', 'base_image', 'generated_at_utc', 'image_digest', 'image_reference', 'release_commit', 'schema', 'workflow_run_id')
          $actualKeys = @($receipt.PSObject.Properties.Name | Sort-Object)
          if ((Compare-Object $expectedKeys $actualKeys).Count -ne 0) {
            throw "Portal image receipt schema differs from the fixed contract."
          }
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant()
          $expectedReference = "ghcr.io/$owner/defense-tracker-portal@$env:PORTAL_IMAGE_DIGEST"
          if ($receipt.schema -ne 1 -or
              $receipt.release_commit -cne $env:RELEASE_SHA -or
              $receipt.image_digest -cne $env:PORTAL_IMAGE_DIGEST -or
              $receipt.image_reference -cne $expectedReference -or
              [string]$receipt.workflow_run_id -cne $env:PORTAL_IMAGE_RUN_ID -or
              $receipt.attestation_url -cnotmatch '^https://github\.com/[^/]+/[^/]+/attestations/[0-9]+$') {
            throw "Portal image receipt does not bind the approved run, commit and digest."
          }
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/v9-portal-image.yml"
          gh attestation verify "oci://$expectedReference" `
            --repo $env:GITHUB_REPOSITORY `
            --bundle-from-oci `
            --signer-workflow $signerWorkflow `
            --source-ref refs/heads/main `
            --source-digest $env:RELEASE_SHA `
            --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw "Portal image provenance verification failed." }
      - name: Reverify hashes, signatures, timestamp and deployment gates
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python scripts\verify_release_assets.py candidate `
            --expected-commit $env:RELEASE_SHA
          python scripts\verify_deployment_evidence.py deployment-evidence `
            --expected-commit $env:RELEASE_SHA `
            --expected-image-digest $env:PORTAL_IMAGE_DIGEST `
            --expected-candidate-run-id $env:CANDIDATE_RUN_ID `
            --expected-collector-key-id $env:DEPLOYMENT_COLLECTOR_KEY_ID `
            --expected-collector-public-key-sha256 $env:DEPLOYMENT_COLLECTOR_PUBLIC_KEY_SHA256 `
            --expected-staging-origin $env:DEPLOYMENT_STAGING_ORIGIN `
            --expected-production-origin $env:DEPLOYMENT_PRODUCTION_ORIGIN
          .\scripts\Verify-ReleaseAuthenticode.ps1 `
            -AssetRoot candidate `
            -PublisherName $env:DEFENSE_TRACKER_PUBLISHER `
            -SignToolPath $env:DEFENSE_TRACKER_SIGNTOOL `
            -ExpectedSignToolSha256 $env:DEFENSE_TRACKER_SIGNTOOL_SHA256 `
            -ExpectedSignerSubjects $env:DEFENSE_TRACKER_EXPECTED_SIGNER_SUBJECTS `
            -ExpectedSignerSpkiSha256 $env:DEFENSE_TRACKER_EXPECTED_SIGNER_SPKI_SHA256 `
            -ExpectedSignerIssuers $env:DEFENSE_TRACKER_EXPECTED_SIGNER_ISSUERS `
            -ExpectedSignerRootSha256 $env:DEFENSE_TRACKER_EXPECTED_SIGNER_ROOT_SHA256
      - name: Verify deployment evidence provenance is bound to its workflow, ref and SHA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/v9-deployment-evidence.yml"
          Get-ChildItem deployment-evidence -File | ForEach-Object {
            gh attestation verify $_.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $signerWorkflow `
              --source-ref refs/heads/main `
              --source-digest $env:RELEASE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Deployment evidence provenance verification failed: $($_.Name)"
            }
          }
      - name: Verify candidate provenance is bound to exact workflow, ref and SHA
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/v9-signed-candidate.yml"
          Get-ChildItem candidate -File | ForEach-Object {
            gh attestation verify $_.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $signerWorkflow `
              --source-ref refs/heads/main `
              --source-digest $env:RELEASE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Candidate provenance verification failed: $($_.Name)"
            }
          }
      - name: Confirm immutable releases are already enabled
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_READ_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "Admin-read token is missing." }
          $setting = gh api `
            -H 'Accept: application/vnd.github+json' `
            -H 'X-GitHub-Api-Version: 2026-03-10' `
            "/repos/$env:GITHUB_REPOSITORY/immutable-releases" | ConvertFrom-Json
          if ($setting.enabled -ne $true) { throw "Immutable releases are not enabled." }
      - name: Generate SLSA provenance for all six fixed assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/*
      - name: Attach SPDX SBOM attestation to the portable application
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/DefenseTracker-v9.0.0-windows-x64-portable.zip
          sbom-path: candidate/DefenseTracker-v9.0.0.spdx.json
      - name: Verify newly generated stable attestations before release creation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $signerWorkflow = "$env:GITHUB_REPOSITORY/.github/workflows/v9-stable-release.yml"
          Get-ChildItem candidate -File | ForEach-Object {
            gh attestation verify $_.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $signerWorkflow `
              --source-ref refs/heads/main `
              --source-digest $env:RELEASE_SHA
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $($_.Name)" }
          }
      - name: Create complete draft, verify it, then publish once
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = python -c "from product_version import PRODUCT_VERSION; print(PRODUCT_VERSION.release_tag)"
          if ($tag -ne 'v9.0.0') { throw "Unexpected release tag." }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0 -or (git rev-parse refs/remotes/origin/main) -cne $env:RELEASE_SHA) {
            throw "Protected main moved before release creation."
          }
          python scripts/verify_release_checks.py `
            --repository $env:GITHUB_REPOSITORY `
            --sha $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Protected checks changed before release creation." }
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify the remote release tag namespace." }
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            throw "Release tag already exists; immutable tags are never reused or moved."
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release or draft already exists; assets are never replaced." }
          $manifest = Get-Content candidate\release-manifest.json -Raw | ConvertFrom-Json
          $notes = @(
            "# DefenseTracker $tag",
            "",
            "Release commit: ``$env:RELEASE_SHA``",
            "Baseline commit: ``$($manifest.release.baseline_commit)``",
            "Portal image: ``$env:PORTAL_IMAGE_DIGEST``",
            "Publisher: $($manifest.signature.publisher)",
            "",
            "This release contains the signed Windows installer, portable application, SHA-256 list, schema-2 manifest, SPDX 2.3 SBOM and third-party notices. Full desktop features remain local; the web Portal is the authenticated collaboration surface."
          )
          $notes | Set-Content -LiteralPath release-notes.md -Encoding UTF8
          $expectedAssetNames = @(
            "DefenseTracker-Setup-v9.0.0-windows-x64.exe",
            "DefenseTracker-v9.0.0-windows-x64-portable.zip",
            "DefenseTracker-v9.0.0.spdx.json",
            "SHA256SUMS.txt",
            "THIRD_PARTY_NOTICES.md",
            "release-manifest.json"
          ) | Sort-Object
          $candidateEntries = @(Get-ChildItem -LiteralPath candidate -Force)
          if ($candidateEntries.Count -ne 6 -or
              @($candidateEntries | Where-Object { $_.PSIsContainer -or $_.LinkType }).Count -ne 0 -or
              (Compare-Object $expectedAssetNames @($candidateEntries.Name | Sort-Object)).Count -ne 0) {
            throw "Candidate does not contain exactly the six fixed regular release assets."
          }
          $expectedAssets = @{}
          foreach ($name in $expectedAssetNames) {
            $path = Join-Path candidate $name
            $item = Get-Item -LiteralPath $path
            $expectedAssets[$name] = [ordered]@{
              digest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = [int64]$item.Length
            }
          }
          function Assert-RemoteReleaseAssets {
            param([Parameter(Mandatory = $true)]$Release,[Parameter(Mandatory = $true)][string]$Phase)
            $remoteNames = @($Release.assets | ForEach-Object { [string]$_.name } | Sort-Object)
            if ($Release.assets.Count -ne 6 -or
                (Compare-Object $expectedAssetNames $remoteNames).Count -ne 0) {
              throw "$Phase release asset names differ from the fixed six-file contract."
            }
            foreach ($asset in $Release.assets) {
              $expected = $expectedAssets[[string]$asset.name]
              if ($null -eq $expected -or $asset.state -cne 'uploaded' -or
                  [string]$asset.digest -cne [string]$expected.digest -or
                  [int64]$asset.size -ne [int64]$expected.bytes) {
                throw "$Phase release asset digest/size mismatch: $($asset.name)"
              }
            }
          }
          function Assert-DownloadedReleaseAssets {
            param([Parameter(Mandatory = $true)][string]$ReleaseTag,[Parameter(Mandatory = $true)][string]$Phase)
            $downloadParent = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            $downloadRoot = Join-Path $downloadParent ("defensetracker-release-download-$Phase-" + [guid]::NewGuid().ToString('N'))
            try {
              New-Item -ItemType Directory -Path $downloadRoot | Out-Null
              gh release download $ReleaseTag --dir $downloadRoot
              if ($LASTEXITCODE -ne 0) { throw "$Phase release asset download failed." }
              $downloaded = @(Get-ChildItem -LiteralPath $downloadRoot -Force)
              if ($downloaded.Count -ne 6 -or
                  @($downloaded | Where-Object { $_.PSIsContainer -or $_.LinkType }).Count -ne 0 -or
                  (Compare-Object $expectedAssetNames @($downloaded.Name | Sort-Object)).Count -ne 0) {
                throw "$Phase downloaded release names differ from the fixed six-file contract."
              }
              foreach ($name in $expectedAssetNames) {
                $path = Join-Path $downloadRoot $name
                $actualDigest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
                $actualBytes = [int64](Get-Item -LiteralPath $path).Length
                if ($actualDigest -cne [string]$expectedAssets[$name].digest -or
                    $actualBytes -ne [int64]$expectedAssets[$name].bytes) {
                  throw "$Phase downloaded release bytes differ: $name"
                }
              }
            } finally {
              if (Test-Path -LiteralPath $downloadRoot -PathType Container) {
                $resolved = [System.IO.Path]::GetFullPath($downloadRoot)
                if (-not $resolved.StartsWith($downloadParent) -or
                    [System.IO.Path]::GetFileName($resolved) -cnotmatch '^defensetracker-release-download-[a-z-]+-[0-9a-f]{32}$') {
                  throw 'Refusing to remove an unexpected release verification directory.'
                }
                Get-ChildItem -LiteralPath $resolved -Force -Recurse | Select-Object FullName,Length | Out-Null
                Remove-Item -LiteralPath $resolved -Recurse -Force
              }
            }
          }
          $assets = @($expectedAssetNames | ForEach-Object { (Get-Item -LiteralPath (Join-Path candidate $_)).FullName })
          & gh release create $tag --draft --target $env:RELEASE_SHA `
            --title "DefenseTracker $tag" --notes-file release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw "Draft release creation failed." }
          $draft = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($draft.draft -ne $true -or $draft.target_commitish -cne $env:RELEASE_SHA) {
            throw "Draft release is incomplete or targets the wrong commit."
          }
          Assert-RemoteReleaseAssets $draft 'draft'
          Assert-DownloadedReleaseAssets $tag 'draft'
          $prematureTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to reverify the remote release tag namespace." }
          if (-not [string]::IsNullOrWhiteSpace($prematureTag)) {
            throw "A release tag appeared before immutable publication; refusing to continue."
          }
          $draftBeforePublish = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($draftBeforePublish.draft -ne $true -or
              $draftBeforePublish.target_commitish -cne $env:RELEASE_SHA) {
            throw "Draft release changed before publication."
          }
          Assert-RemoteReleaseAssets $draftBeforePublish 'draft-before-publish'
          Assert-DownloadedReleaseAssets $tag 'draft-before-publish'
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Draft publication failed." }
          $publishedBeforeImmutableCheck = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($publishedBeforeImmutableCheck.draft -ne $false -or
              $publishedBeforeImmutableCheck.target_commitish -cne $env:RELEASE_SHA) {
            throw "Published release differs from the approved commit."
          }
          Assert-RemoteReleaseAssets $publishedBeforeImmutableCheck 'published-before-immutable-check'
          Assert-DownloadedReleaseAssets $tag 'published-before-immutable-check'
          if ($publishedBeforeImmutableCheck.immutable -ne $true) {
            throw "Published release did not become immutable."
          }
          $publishedAfterImmutableCheck = gh api "/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($publishedAfterImmutableCheck.draft -ne $false -or
              $publishedAfterImmutableCheck.immutable -ne $true -or
              $publishedAfterImmutableCheck.target_commitish -cne $env:RELEASE_SHA) {
            throw "Published release changed while confirming immutability."
          }
          Assert-RemoteReleaseAssets $publishedAfterImmutableCheck 'published-after-immutable-check'
          Assert-DownloadedReleaseAssets $tag 'published-after-immutable-check'
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          if ((git rev-list -n 1 $tag) -ne $env:RELEASE_SHA) { throw "Published tag does not point to the release commit." }
