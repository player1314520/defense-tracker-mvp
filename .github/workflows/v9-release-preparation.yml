name: V9 release preparation

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact protected main commit to prepare
        required: true
        type: string

# The preparation workflow has no signing, decryption, or publication identity.
# It emits only an age-encrypted application bundle and a public review request.
permissions: {}

concurrency:
  group: v9-release-preparation
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  verify-release-request:
    name: Resolve exact protected main SHA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify protected main without checkout
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_FILE_REF: ${{ github.workflow_ref }}
        run: |
          import json
          import os
          import re
          import urllib.request

          repository = "player1314520/defense-tracker-mvp"
          expected_workflow = (
              f"{repository}/.github/workflows/v9-release-preparation.yml@refs/heads/main"
          )
          if (
              os.environ["WORKFLOW_REPOSITORY"] != repository
              or os.environ["WORKFLOW_REF"] != "refs/heads/main"
              or os.environ["WORKFLOW_FILE_REF"] != expected_workflow
              or re.fullmatch(r"[0-9a-f]{40}", os.environ["REQUESTED_SHA"]) is None
              or os.environ["REQUESTED_SHA"] != os.environ["WORKFLOW_SHA"]
          ):
              raise SystemExit("Preparation is not bound to exact protected main")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/ref/heads/main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "DefenseTracker-release-preparation",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if payload.get("object", {}).get("sha") != os.environ["REQUESTED_SHA"]:
              raise SystemExit("Requested commit is no longer protected main")

  verify-source:
    name: Recheck exact source history and protected CI
    needs: verify-release-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
      - name: Reverify Git identity and full-history privacy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_git_history.py --revision "${RELEASE_SHA}"
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          report="$RUNNER_TEMP/gitleaks-report.json"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          if ! "$tool_dir/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report" --log-opts="--all" . \
            >/dev/null 2>&1; then
            echo "::error::Pinned Gitleaks full-history scan failed; sensitive findings are intentionally not printed."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          python scripts/verify_release_checks.py \
            --repository "player1314520/defense-tracker-mvp" \
            --sha "${RELEASE_SHA}"

  prepare-unsigned-application:
    name: Build, inspect, and encrypt unsigned application
    needs: verify-source
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      ENVELOPE_NAME: DefenseTracker-v9.0.0-application-unsigned-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REQUEST_ARTIFACT_NAME: DefenseTracker-v9.0.0-application-signing-request-${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Set one-use preparation root
        shell: pwsh
        run: |
          "PREPARATION_ROOT=${{ runner.temp }}\DefenseTracker-v9-preparation" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          architecture: x64
      - name: Install verified desktop runtime
        shell: pwsh
        run: .\scripts\Install-VerifiedWebView2Runtime.ps1
      - name: Bootstrap pinned credentialless build tools
        shell: pwsh
        run: .\scripts\Initialize-GitHubHostedReleaseTools.ps1 -Mode VerificationOnly
      - name: Bootstrap pinned age transport
        shell: pwsh
        run: .\scripts\Initialize-ReleaseArtifactCrypto.ps1
      - name: Reverify source and prepare isolated build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_SHA -cne $env:RELEASE_SHA -or
              (git rev-parse HEAD) -cne $env:RELEASE_SHA) {
            throw 'Preparation is not using the exact fresh hosted runner and commit.'
          }
          git fetch --no-tags origin main
          if ((git rev-parse refs/remotes/origin/main) -cne $env:RELEASE_SHA) {
            throw 'Protected main moved before preparation.'
          }
          python scripts\verify_release_checks.py `
            --repository $env:GITHUB_REPOSITORY `
            --sha $env:RELEASE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Protected checks are not green.' }
          .\scripts\Prepare-BuildEnv.ps1 -RequireExpectedPythonHash
      - name: Create unsigned application signing request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\Prepare-UnsignedApplicationBundle.ps1 `
            -ExpectedReleaseSha $env:RELEASE_SHA `
            -OutputRoot $env:PREPARATION_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned application preparation failed.' }
      - name: Encrypt the application bundle for protected processing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $envelope = Join-Path $env:PREPARATION_ROOT 'application-envelope'
          .\scripts\Protect-ReleaseArtifact.ps1 `
            -AgeExecutable $env:DEFENSE_TRACKER_AGE `
            -ExpectedAgeExecutableSha256 $env:DEFENSE_TRACKER_AGE_SHA256 `
            -PlaintextRoot (Join-Path $env:PREPARATION_ROOT 'application-unsigned-bundle') `
            -RecipientFile .\release\candidate-transport-recipient.txt `
            -OutputDirectory $envelope `
            -ArtifactName $env:ENVELOPE_NAME `
            -Repository $env:GITHUB_REPOSITORY `
            -ReleaseCommit $env:RELEASE_SHA `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT
          $public = Join-Path $env:PREPARATION_ROOT 'application-request-public'
          New-Item -ItemType Directory -Path $public | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:PREPARATION_ROOT 'application-signing-request.json') `
            -Destination (Join-Path $public 'application-signing-request.json')
          $requestSha = (Get-FileHash `
            -LiteralPath (Join-Path $public 'application-signing-request.json') `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          "application_request_sha256=$requestSha" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
        id: seal
      - name: Upload encrypted application envelope
        id: envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ENVELOPE_NAME }}
          path: ${{ env.PREPARATION_ROOT }}\application-envelope\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          include-hidden-files: false
      - name: Upload public application signing request
        id: request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.REQUEST_ARTIFACT_NAME }}
          path: ${{ env.PREPARATION_ROOT }}\application-request-public\application-signing-request.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 5
          include-hidden-files: false
      - name: Publish exact handoff identifiers
        shell: pwsh
        env:
          ENVELOPE_DIGEST: ${{ steps.envelope.outputs.artifact-digest }}
          REQUEST_DIGEST: ${{ steps.request.outputs.artifact-digest }}
          REQUEST_SHA256: ${{ steps.seal.outputs.application_request_sha256 }}
        run: |
          @(
            '### V9 application signing handoff',
            '',
            "- source run: ``$env:GITHUB_RUN_ID`` attempt ``$env:GITHUB_RUN_ATTEMPT``",
            "- encrypted artifact: ``$env:ENVELOPE_NAME``",
            "- encrypted artifact digest: ``$env:ENVELOPE_DIGEST``",
            "- request artifact: ``$env:REQUEST_ARTIFACT_NAME``",
            "- request artifact digest: ``$env:REQUEST_DIGEST``",
            "- signing request SHA-256: ``$env:REQUEST_SHA256``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
