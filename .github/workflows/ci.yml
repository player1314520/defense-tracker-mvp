name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_LINUX_X64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  POSTGRESQL_ISOLATION_VERSION: "15.19"
  POSTGRESQL_ISOLATION_SHA256: "e1a64a87a46b825b88c082e4518161a47aab53c45694964f8ba1df28f7859f89"

jobs:
  public-tree:
    name: Public tree policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify release-era commit identities and private metadata policy
        run: python scripts/verify_git_history.py
      - name: Scan complete Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tool_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          report="$RUNNER_TEMP/gitleaks-report.json"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          if ! "$tool_dir/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$report" --log-opts="--all" . \
            >/dev/null 2>&1; then
            echo "::error::Pinned Gitleaks full-history scan failed; sensitive findings are intentionally not printed."
            exit 1
          fi
      - name: Validate GitHub Actions workflows with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$tool_dir"
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -no-color -shellcheck= -pyflakes= \
            -ignore 'label ".+" is unknown'
      - name: Verify public snapshot contents
        run: python scripts/verify_public_tree.py

  python-tests:
    name: Python 3.11 (${{ matrix.os }})
    needs: public-tree
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-lock: requirements.ci-linux.lock
            source-exceptions: sgmllib3k
          - os: windows-latest
            python-lock: requirements.ci-windows.lock
            source-exceptions: sgmllib3k,proxy-tools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.bootstrap.lock
            ${{ matrix.python-lock }}
      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.bootstrap.lock
          python -m pip install --require-hashes --only-binary=:all: --no-binary=${{ matrix.source-exceptions }} --no-build-isolation -r ${{ matrix.python-lock }}
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run Python tests
        run: python -m pytest -q

  javascript:
    name: JavaScript tests and reproducible bundles
    needs: public-tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/v9-auth/package-lock.json
      - name: Install locked JavaScript dependencies
        run: npm ci --prefix web/v9-auth
      - name: Audit JavaScript dependencies
        run: npm audit --prefix web/v9-auth --audit-level=high
      - name: Run JavaScript tests
        run: node --test tests/js/*.test.mjs tests/js/*.test.cjs
      - name: Rebuild browser bundles
        run: npm run build --prefix web/v9-auth
      - name: Check generated bundles are current
        run: git diff --exit-code -- static/js/vendor/v9-supabase-auth.mjs web/v9-portal/supabase-client.mjs

  edge-functions:
    name: Supabase Edge Functions
    needs: public-tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.5
        with:
          deno-version: v2.9.5
      - name: Lint Edge Functions
        run: deno lint supabase/functions
      - name: Type-check Edge Functions
        run: >-
          deno check
          supabase/functions/access-applications/index.ts
          supabase/functions/invite-member/admin-provisioning.ts
          supabase/functions/invite-member/index.ts

  deployment-assets:
    name: MVP deployment assets
    needs: public-tree
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.ci-deployment.lock
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.116.0
      - name: Install hash-locked deployment test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r requirements.ci-deployment.lock
      - name: Verify deployment test dependency consistency
        run: python -m pip check
      - name: Run deployment contract tests
        run: >-
          python -m pytest -q
          tests/test_mvp_deployment_assets.py
          tests/test_mvp_supabase_access_contract.py
          tests/test_mvp_supabase_bootstrap_contract.py
          tests/test_mvp_supabase_byok_contract.py
          tests/test_mvp_supabase_device_registration_contract.py
          tests/test_mvp_supabase_first_owner_envelope_contract.py
          tests/test_mvp_supabase_invitation_contract.py
          tests/test_mvp_supabase_session_contract.py
      - name: Start a fresh local database and apply every migration
        run: |
          supabase db start
          supabase migration list --local
      - name: Run transactional pgTAP database tests
        run: supabase test db
      - name: Run atomic organization-byte quota isolation test
        shell: bash
        env:
          PGAPPNAME: defense-tracker/v9-byte-quota-isolation
          PGCONNECT_TIMEOUT: "5"
          PG_TEST_TIMEOUT_DEFAULT: "15"
        run: |
          set -Eeuo pipefail
          pg_tar="$RUNNER_TEMP/postgresql-${POSTGRESQL_ISOLATION_VERSION}.tar.bz2"
          pg_src="$RUNNER_TEMP/postgresql-${POSTGRESQL_ISOLATION_VERSION}"
          pg_build="$RUNNER_TEMP/postgresql-${POSTGRESQL_ISOLATION_VERSION}-build"
          iso_out="$RUNNER_TEMP/v9-sync-byte-quota-isolation.out"

          for command_name in curl sha256sum tar make cc; do
            command -v "$command_name" >/dev/null
          done
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://ftp.postgresql.org/pub/source/v${POSTGRESQL_ISOLATION_VERSION}/postgresql-${POSTGRESQL_ISOLATION_VERSION}.tar.bz2" \
            --output "$pg_tar"
          printf '%s  %s\n' "$POSTGRESQL_ISOLATION_SHA256" "$pg_tar" | \
            sha256sum --check --strict -
          tar -xjf "$pg_tar" -C "$RUNNER_TEMP"
          mkdir "$pg_build"
          cd "$pg_build"
          "$pg_src/configure" --without-readline --without-zlib
          make -C src/test/isolation -j2 isolationtester
          isolationtester="$pg_build/src/test/isolation/isolationtester"
          export LD_LIBRARY_PATH="$pg_build/src/interfaces/libpq${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          test "$("$isolationtester" -V)" = \
            "isolationtester (PostgreSQL) ${POSTGRESQL_ISOLATION_VERSION}"

          cd "$GITHUB_WORKSPACE"
          db_url="$(supabase status -o json | python -c \
            'import json,sys; print(json.load(sys.stdin)["DB_URL"])')"
          python - "$db_url" <<'PY'
          import sys
          from urllib.parse import urlparse

          url = urlparse(sys.argv[1])
          if not (
              url.scheme in {"postgres", "postgresql"}
              and url.hostname == "127.0.0.1"
              and url.port == 54322
              and url.username == "postgres"
              and url.path == "/postgres"
          ):
              raise SystemExit("refusing to run isolation fixture against a non-local database")
          PY

          if ! "$isolationtester" "$db_url" \
            < supabase/tests/v9_sync_byte_quota_isolation.spec \
            > "$iso_out" 2>&1; then
            cat "$iso_out"
            exit 1
          fi
          python - "$iso_out" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          expected_headers = [
              "starting permutation: s1_begin s1_claim s2_begin s2_claim "
              "s1_reserve s2_reserve s1_commit s2_commit",
              "starting permutation: s1_begin s1_claim s2_begin s2_claim "
              "s2_reserve s1_reserve s2_commit s1_commit",
          ]
          starts = [
              index
              for index, line in enumerate(lines)
              if line.startswith("starting permutation:")
          ]
          headers = [lines[index] for index in starts]
          if headers != expected_headers:
              raise SystemExit(f"expected exactly the two reviewed permutations, got {headers!r}")
          if lines.count("Parsed test spec with 2 sessions") != 1:
              raise SystemExit("isolationtester did not parse exactly two sessions")
          sections = [
              lines[starts[index] : starts[index + 1] if index + 1 < len(starts) else len(lines)]
              for index in range(len(starts))
          ]
          quota_error = re.compile(
              r"^ERROR:\s+daily organization sync byte limit exceeded$"
          )
          forbidden = (
              "setup failed:",
              "teardown failed:",
              "timed out after",
              "failed to complete permutation",
              "failed to send query",
              "unexpected result status:",
              "isolationtester: canceling",
          )
          for number, (section, loser) in enumerate(
              zip(sections, ("s2_reserve", "s1_reserve"), strict=True), start=1
          ):
              errors = [line for line in section if line.startswith("ERROR:")]
              if len(errors) != 1 or not quota_error.fullmatch(errors[0]):
                  raise SystemExit(
                      f"permutation {number} expected one quota rejection, got {errors!r}"
                  )
              completion = f"step {loser}: <... completed>"
              try:
                  completion_index = section.index(completion)
              except ValueError as exc:
                  raise SystemExit(
                      f"permutation {number} did not serialize the losing reservation"
                  ) from exc
              if (
                  completion_index + 1 >= len(section)
                  or not quota_error.fullmatch(section[completion_index + 1])
              ):
                  raise SystemExit(
                      f"permutation {number} quota error was not emitted by {loser}"
                  )
              if any(token in line for token in forbidden for line in section):
                  raise SystemExit(
                      f"permutation {number} contains an unexpected harness failure"
                  )
          print("isolation gate passed: 2 permutations; 1 rejection each")
          PY
      - name: Validate release-input allowlist
        run: python scripts/prepare_mvp_portal_context.py --check-only
      - name: Validate deployment script syntax
        shell: bash
        run: |
          python -m py_compile deploy/mvp/bin/probe-public.py scripts/prepare_mvp_portal_context.py
          bash -n deploy/mvp/bin/*.sh deploy/mvp/portal-entrypoint.sh
      - name: Validate Compose configuration with inert placeholders
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mvp-secrets"
          printf '%s\n' 'sb_publishable_static_config_check' > "$RUNNER_TEMP/mvp-secrets/supabase_publishable_key"
          export MVP_SECRETS_DIR="$RUNNER_TEMP/mvp-secrets"
          export CADDY_IMAGE="caddy@sha256:$(printf '0%.0s' {1..64})"
          docker compose version
          docker compose \
            --env-file deploy/mvp/production.env.example \
            --file deploy/mvp/docker-compose.production.yml \
            config --quiet
      - name: Build the hash-locked full-stack server image
        run: docker build --file deploy/Dockerfile --tag defense-tracker-full-stack:ci .
      - name: Stop the local Supabase database
        if: always()
        run: supabase stop --no-backup
